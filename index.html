<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>setTimeout setInterval</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <section class="card" id="task1">
    <h2>1. Електронне табло Зворотний відлік</h2>
    <button id="startCountdown">Старт</button>
    <div id="countdown" class="display"></div>
  </section>

  <section class="card" id="task2">
    <h2>2. Захист від спаму (Debounce)</h2>
    <button id="submitBtn">Надіслати</button>
    <p id="submitStatus"></p>
  </section>

  <section class="card" id="task3">
    <h2>3. Автоматичний слайдер</h2>
    <div id="slider" class="slide">Слайд</div>
    <div class="controls">
      <button id="pauseBtn">Пауза</button>
      <button id="resumeBtn">Продовжити</button>
    </div>
  </section>

  <section class="card" id="task4">
    <h2>4. Світлофор</h2>
    <div class="traffic">
      <div class="light" id="red"></div>
      <div class="light" id="yellow"></div>
      <div class="light" id="green"></div>
    </div>
    <p>Поточний колір: <span id="currentColor">—</span></p>
  </section>

  <section class="card" id="task5">
    <h2>5. Годинник</h2>
    <div id="clock" class="display">00:00:00</div>
    <button id="toggleClock">Зупинити годинник</button>
  </section>

  <script src="js/app.js"></script>
</body>
</html>
